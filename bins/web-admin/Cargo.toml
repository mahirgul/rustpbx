[package]
name = "web-admin"
version = "0.1.0"
edition = "2021"
description = "Single-Pane-of-Glass Embedded Web Admin Interface for RustPBX"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust-embed = "8.5"
mime_guess = "2.0"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
toml = { workspace = true }
thiserror = { workspace = true }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
